name: Plotwise checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plotwise/plotwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plotwise/plotwise/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js
